name: Rendering tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rendering-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@v1.2.1
      with:
        vulkan-query-version: 1.4.341.1
        vulkan-components: Vulkan-Headers, Vulkan-Loader, SPIRV-Tools, Glslang
        vulkan-use-cache: true

    - name: Configure
      # NOTHOFAGUS_FETCH_SWIFTSHADER downloads + SHA256-verifies the pinned
      # prebuilt SwiftShader ICD at configure time (coordinates live in
      # cmake/swiftshader_version.cmake — the single source of truth shared with
      # local builds). The test binary self-selects it at runtime via
      # NOTHOFAGUS_RENDER_BACKEND=swiftshader, so no system ICD registration is
      # needed. This lane is byte-identical to a local
      # linux-release-headless-vulkan-tests build.
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release
        -DNOTHOFAGUS_BACKEND_VULKAN=ON
        -DNOTHOFAGUS_HEADLESS_VULKAN=ON
        -DNOTHOFAGUS_FETCH_SWIFTSHADER=ON
        -DNOTHOFAGUS_BUILD_TESTS=ON
        -DNOTHOFAGUS_BUILD_TESTS_VISUAL=ON
        -DNOTHOFAGUS_BUILD_TESTS_NONVISUAL=ON
        -DNOTHOFAGUS_USE_GLSLANG=ON
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build build --config Release --target rendering_tests dense_land_tests sparse_land_tests

    - name: Run nonvisual tests
      run: |
        ./build/tests/nonvisual/dense_land_tests
        ./build/tests/nonvisual/sparse_land_tests

    - name: Run tests against Vulkan golden files
      env:
        NOTHOFAGUS_RENDER_BACKEND: swiftshader
      run: ./build/tests/visual/rendering_tests

    - name: Update Vulkan golden files if missing
      if: failure()
      env:
        NOTHOFAGUS_RENDER_BACKEND: swiftshader
      run: |
        echo "Tests failed — regenerating Vulkan golden PNGs."
        echo "Goldens are PNG images (via stb_image_plus); comparison is tolerance-based."
        echo "To inspect golden/actual/diff visually, build the Visual Tests Explorer tool"
        echo "(-DNOTHOFAGUS_BUILD_VISUAL_TESTS_EXPLORER=ON) after running the tests with DUMP_ACTUAL=1."
        echo "If a rendering change is expected, regenerate locally:"
        echo "  cmake --preset linux-release-headless-vulkan-tests"
        echo "  cmake --build build/linux-release-headless-vulkan-tests --target rendering_tests"
        echo "  NOTHOFAGUS_RENDER_BACKEND=swiftshader UPDATE_GOLDEN=1 ./build/linux-release-headless-vulkan-tests/tests/visual/rendering_tests"
        echo "Then commit the updated golden/*.png files."
        UPDATE_GOLDEN=1 ./build/tests/visual/rendering_tests
        echo "--- Updated golden files ---"
        ls -la tests/visual/golden/
