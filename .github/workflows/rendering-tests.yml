name: Rendering tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rendering-tests:
    runs-on: ubuntu-latest

    env:
      GOLDEN_DIR: ${{ github.workspace }}/tests/visual/golden_headless_vulkan

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@v1.2.1
      with:
        vulkan-query-version: 1.4.341.1
        vulkan-components: Vulkan-Headers, Vulkan-Loader, SPIRV-Tools, Glslang
        vulkan-use-cache: true

    - name: Download and register prebuilt SwiftShader ICD
      # Fetches a SwiftShader Vulkan ICD built from a pinned upstream commit
      # (https://github.com/dantros/swiftshader_prebuilts), verifies its SHA256,
      # and registers it as the system's Vulkan ICD so rendering_tests runs
      # against deterministic CPU-rasterizer pixels (no GPU-driver rounding noise).
      #
      # To bump the SwiftShader version: publish a new prebuilt release with the
      # new commit SHA in its filename + tag, then update the URL and HASH below
      # (and re-run any golden regen needed on the consumer side).
      env:
        SWIFTSHADER_URL:    "https://github.com/dantros/swiftshader_prebuilts/releases/download/swiftshader-d26a3e66-linux-x86_64/libvk_swiftshader-d26a3e66-linux-x86_64.so"
        SWIFTSHADER_SHA256: "fbf976da70759946eaf3cd97cbff52b8aece93b8bd80c9f05112082040d85d92"
      run: |
        mkdir -p ${{ runner.temp }}/swiftshader
        curl -fsSL -o ${{ runner.temp }}/swiftshader/libvk_swiftshader.so "$SWIFTSHADER_URL"
        echo "$SWIFTSHADER_SHA256  ${{ runner.temp }}/swiftshader/libvk_swiftshader.so" | sha256sum -c -
        sudo mkdir -p /etc/vulkan/icd.d
        echo '{
          "file_format_version": "1.0.0",
          "ICD": {
            "library_path": "${{ runner.temp }}/swiftshader/libvk_swiftshader.so",
            "api_version": "1.3.0"
          }
        }' | sudo tee /etc/vulkan/icd.d/swiftshader.json

    - name: Configure
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release
        -DNOTHOFAGUS_BACKEND_VULKAN=ON
        -DNOTHOFAGUS_HEADLESS_VULKAN=ON
        -DNOTHOFAGUS_BUILD_TESTS=ON
        -DNOTHOFAGUS_BUILD_TESTS_VISUAL=ON
        -DNOTHOFAGUS_BUILD_TESTS_NONVISUAL=ON
        -DNOTHOFAGUS_USE_GLSLANG=ON
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build build --config Release --target rendering_tests tilemap_tests sparsemap_tests

    - name: Run nonvisual tests
      # Pure-data CPU tests (Tilemap / Sparsemap / IndirectTexture logic). They never
      # create a Canvas or render, so they need no Vulkan device or display server —
      # they just link the already-built headless-Vulkan nothofagus library. Run first:
      # fast CPU checks fail fast before the heavier visual golden comparison.
      run: |
        ./build/tests/nonvisual/tilemap_tests
        ./build/tests/nonvisual/sparsemap_tests

    - name: Run tests against Vulkan golden files
      run: ./build/tests/visual/rendering_tests

    - name: Update Vulkan golden files if missing
      if: failure()
      run: |
        echo "Tests failed — regenerating Vulkan golden files."
        echo "If this is expected (rendering change), run locally:"
        echo "  GOLDEN_DIR=tests/visual/golden_headless_vulkan UPDATE_GOLDEN=1 ./build/tests/visual/rendering_tests"
        echo "Then commit the updated golden_headless_vulkan/ files."
        UPDATE_GOLDEN=1 ./build/tests/visual/rendering_tests
        echo "--- Updated golden files ---"
        ls -la tests/visual/golden_headless_vulkan/
